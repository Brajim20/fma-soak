# FMA soak (fleetdm/fleet#55961): installs, upgrades and uninstalls Fleet-maintained apps on two real soak hosts
# through a Fleet instance, and audits the FMA catalog daily. See README.md.
#
# Settings (repository variables, Settings → Secrets and variables → Actions → Variables):
#   FLEET_URL              the Fleet instance
#   FMA_SOAK_FLEET_ID      the only fleet the harness touches
#   FMA_SOAK_HOST_DARWIN   macOS soak host IDs, comma-separated (first = primary; the others only sample new apps, up to 3 hosts)
#   FMA_SOAK_HOST_WINDOWS  Windows soak host IDs, the same way
#   FMA_SOAK_POOL_DARWIN   optional: pool slots, e.g. "90001,90002": one GitHub macOS runner per slot joins the soak
#                          for the pass and deletes its host afterwards (soak/pool.py). Empty = no pool job.
#   FMA_SOAK_CHAIN         optional: "off" stops each run from starting the next (the cron backup still runs)
# Secrets (environment `fma-soak`, so no other workflow can read them):
#   FMA_SOAK_TOKEN         API-only harness user, Maintainer on that fleet only
#   FMA_SOAK_UI_EMAIL      optional: Observer on that fleet only, for evidence screenshots. Without it the
#   FMA_SOAK_UI_PASSWORD   screenshots are recorded as unavailable and the API evidence stands.
#   FMA_SOAK_ENROLL_SECRET the soak fleet's enroll secret, for the pool runners' fleetd package
#
# How runs keep going: GitHub's cron skips and delays runs on a quiet repo by hours, so each soak run starts the next
# one when it ends (`next` job). The crons are only a backup that restarts the chain if it breaks. The concurrency
# group allows one running soak run and at most one waiting, so a backup run never doubles up with the chain.
# Each run: a fixed-length pass on both hosts, a `watch` job beside it (hosts online every 30 min with an issue in
# this repo as the alert, residents' upstream releases every 2 h, the daily audit when it's due), then the report.
#
# State lives on the `results` branch: harness state, run records (output scrubbed of account names) and the
# daily digests. Screenshots and logs are run artifacts only, kept 30 days.
#
# To stop everything: disable the workflow. Cancelling a run also stops the chain (a cancelled run doesn't start the
# next); the cron backup then restarts it within 6 h unless the workflow is disabled.
# Never run this and the local launchd loop against the same hosts: both would install on them at once.
name: FMA soak

on:
  schedule:
    - cron: "15 */6 * * *"   # backup: restarts the soak chain if it broke
    - cron: "0 11 * * *"     # backup: catalog audit (the watch job normally runs it first; it runs once a day)
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [soak, audit, watcher]
        default: soak

concurrency:
  group: fma-soak-${{ github.event.schedule == '0 11 * * *' && 'audit' || inputs.job || 'soak' }}
  cancel-in-progress: false   # never kill a pass mid-install; the next one waits

permissions:
  contents: write   # the results branch only
  actions: write    # the next soak run
  issues: write     # host-outage alerts

env:
  TZ: America/Puerto_Rico   # digest dates in the tester's local time
  FLEET_URL: ${{ vars.FLEET_URL }}
  FMA_SOAK_FLEET_ID: ${{ vars.FMA_SOAK_FLEET_ID }}
  FMA_SOAK_HOST_DARWIN: ${{ vars.FMA_SOAK_HOST_DARWIN }}
  FMA_SOAK_HOST_WINDOWS: ${{ vars.FMA_SOAK_HOST_WINDOWS }}
  FMA_SOAK_POOL_DARWIN: ${{ vars.FMA_SOAK_POOL_DARWIN }}   # every job: the long-standing hosts skip the pool's share
  FMA_CATALOG_REPO: ${{ github.workspace }}/fleet
  FMA_SOAK_PASS_MINUTES: 300   # under the 6 h job limit with room for setup, saves and the report
  FMA_SOAK_AUDIT_ONCE: "1"
  FMA_SOAK_NO_DIGEST: "1"      # only the report job writes the digest

jobs:
  soak:
    if: github.event.schedule == '15 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'soak')
    runs-on: ubuntu-latest
    environment: fma-soak
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        # slot 0 = the platform's primary host (the full pass); slots 1 and 2 = more hosts, sample only. A slot with no
        # host in FMA_SOAK_HOST_<PLATFORM> skips itself.
        platform: [darwin, windows]
        slot: [0, 1, 2]
    env:
      FMA_SOAK_TOKEN: ${{ secrets.FMA_SOAK_TOKEN }}
      FMA_SOAK_UI_EMAIL: ${{ secrets.FMA_SOAK_UI_EMAIL }}
      FMA_SOAK_UI_PASSWORD: ${{ secrets.FMA_SOAK_UI_PASSWORD }}
    steps:
      - name: Host for this slot
        id: slot
        env: { HOSTS: "${{ matrix.platform == 'darwin' && vars.FMA_SOAK_HOST_DARWIN || vars.FMA_SOAK_HOST_WINDOWS }}" }
        run: |
          h=$(echo "$HOSTS" | tr -d ' ' | cut -d, -f$(( ${{ matrix.slot }} + 1 )) -s)
          [[ ${{ matrix.slot }} == 0 ]] && h=${HOSTS%%,*}
          [[ -n $h ]] && echo "host=$h" >> "$GITHUB_OUTPUT" || echo "no host in slot ${{ matrix.slot }}: skipping"
      - uses: actions/checkout@v4
        if: steps.slot.outputs.host
        with: { path: harness }
      - uses: ./harness/.github/actions/setup
        if: steps.slot.outputs.host
      - name: Restore state
        if: steps.slot.outputs.host
        run: ./harness/ci/results.sh restore
      - name: Health (skip the pass if the instance or token is down)
        id: health
        if: steps.slot.outputs.host
        working-directory: harness/soak
        run: python3 -c "import loop,sys; ok,info=loop.health(); print(info); sys.exit(0 if ok else 78)" || echo "skip=1" >> "$GITHUB_OUTPUT"
      - name: Pass
        if: steps.slot.outputs.host && steps.health.outputs.skip != '1'
        working-directory: harness/soak
        env:
          FMA_SOAK_WATCHER_JOB: "1"   # the watch job checks residents, not the pass
        run: zsh pass.sh ${{ matrix.platform }} ${{ matrix.slot != 0 && steps.slot.outputs.host || '' }}
      - name: Save state and records
        if: always() && steps.slot.outputs.host
        run: ./harness/ci/results.sh save "soak ${{ matrix.platform }} ${{ steps.slot.outputs.host }} ${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.slot.outputs.host
        with:
          name: soak-${{ matrix.platform }}-${{ matrix.slot }}-${{ github.run_id }}
          path: |
            harness/results/soak/*/evidence/
            harness/logs/
          if-no-files-found: ignore
          retention-days: 30

  pool:
    # GitHub macOS runners as extra, ephemeral soak hosts (soak/pool.py): each slot enrolls this VM into the soak fleet,
    # samples the slot's share of new apps for the pass, then deletes its host. A real macOS VM with real installs, but
    # not MDM-enrolled and with GitHub's preinstalled tools (the harness skips apps it didn't install), so its findings
    # get rerun on a long-standing host (crosshost.py) before anyone files them.
    if: >-
      vars.FMA_SOAK_POOL_DARWIN != '' &&
      (github.event.schedule == '15 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'soak'))
    runs-on: macos-15
    environment: fma-soak
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(format('[{0}]', vars.FMA_SOAK_POOL_DARWIN || '0')) }}
    env:
      FMA_SOAK_TOKEN: ${{ secrets.FMA_SOAK_TOKEN }}
      FMA_SOAK_POOL_SLOT: ${{ matrix.slot }}
      FMA_SOAK_PASS_MINUTES: 285   # enrolling and the finish step take the rest of the soak job's 300
      RUNNER_HOSTNAME: fma-pool-${{ matrix.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with: { path: harness }
      - uses: ./harness/.github/actions/setup
        with: { browser: "false" }
      - name: Restore state
        run: ./harness/ci/results.sh restore
      - name: Health (skip the pass if the instance or token is down)
        id: health
        working-directory: harness/soak
        run: python3 -c "import loop,sys; ok,info=loop.health(); print(info); sys.exit(0 if ok else 78)" || echo "skip=1" >> "$GITHUB_OUTPUT"
      - name: Remove pool hosts a killed job left behind
        if: steps.health.outputs.skip != '1'
        working-directory: harness/soak
        run: python3 -u pool.py sweep
      - name: Enroll this runner
        id: enroll
        if: steps.health.outputs.skip != '1'
        working-directory: harness/soak
        env:
          FMA_SOAK_ENROLL_SECRET: ${{ secrets.FMA_SOAK_ENROLL_SECRET }}
        run: |
          for k in ComputerName HostName LocalHostName; do sudo scutil --set $k "$RUNNER_HOSTNAME"; done
          npm i -g -s fleetctl
          fleetctl package --type=pkg --fleet-url="$FLEET_URL" --enroll-secret="$FMA_SOAK_ENROLL_SECRET" \
            --enable-scripts --fleet-desktop --host-identifier=instance --disable-open-folder --outfile "$RUNNER_TEMP/fleetd.pkg"
          sudo installer -pkg "$RUNNER_TEMP/fleetd.pkg" -target /
          echo "console user: $(stat -f%Su /dev/console)"
          echo "host=$(python3 -u pool.py wait --hostname "$RUNNER_HOSTNAME")" >> "$GITHUB_OUTPUT"
      - name: Pass
        if: steps.enroll.outputs.host
        working-directory: harness/soak
        run: zsh pass.sh darwin ${{ steps.enroll.outputs.host }}
      - name: Uninstall leftovers and delete this runner's host
        if: always() && steps.enroll.outputs.host
        working-directory: harness/soak
        run: |
          python3 -u runner.py --cleanup darwin --host ${{ steps.enroll.outputs.host }} || true
          # stop fleetd first: a running fleetd re-enrolls within seconds of the delete and leaves an orphan host
          sudo launchctl bootout system/com.fleetdm.orbit 2>/dev/null || true
          python3 -u pool.py finish --host ${{ steps.enroll.outputs.host }} --hostname "$RUNNER_HOSTNAME"
      - name: Save state and records
        if: always()
        run: ./harness/ci/results.sh save "pool ${{ matrix.slot }} ${{ steps.enroll.outputs.host }} ${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-${{ matrix.slot }}-${{ github.run_id }}
          path: harness/logs/
          if-no-files-found: ignore
          retention-days: 30

  watch:
    # Beside the pass, for as long as it runs. Only reads Fleet and runs live queries (no installs). Owns
    # results/transitions/, results/state/outages.json and the audit files; the pass skips its own watcher check.
    if: github.event.schedule == '15 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'soak')
    runs-on: ubuntu-latest
    environment: fma-soak
    timeout-minutes: 340
    env:
      FMA_SOAK_TOKEN: ${{ secrets.FMA_SOAK_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { path: harness }
      - uses: ./harness/.github/actions/setup
        with: { browser: "false" }
      - run: ./harness/ci/results.sh restore
      - name: Hosts every 30 min, residents every 2 h, audit when due
        working-directory: harness/soak
        run: |
          set +e   # one failed check must not end the loop
          end=$(( $(date +%s) + FMA_SOAK_PASS_MINUTES * 60 ))
          soak_done() {  # both pass jobs finished (a short pass: hosts offline, instance down): stop with them
            gh run view ${{ github.run_id }} -R ${{ github.repository }} --json jobs \
              --jq '[.jobs[]|select(.name|startswith("soak"))|.status]|length > 0 and all(. == "completed")' | grep -q true
          }
          tick=0
          while :; do
            echo "::group::$(date '+%F %T') check $tick"
            python3 -u hosts.py > "$RUNNER_TEMP/hosts.out" 2>&1; rc=$?
            cat "$RUNNER_TEMP/hosts.out"
            ../ci/alert.sh "$RUNNER_TEMP/hosts.out" $rc
            # a queue that stopped moving (an install hung the host): restart it through MDM, quarantine the culprit
            python3 -u stuck.py > "$RUNNER_TEMP/stuck.out" 2>&1; rc=$?
            cat "$RUNNER_TEMP/stuck.out"
            ../ci/alert.sh "$RUNNER_TEMP/stuck.out" $rc "Soak host stuck" "no longer stuck"
            # a host running out of disk fails every install there (631 reached 0.17 GB on 2026-11-05)
            python3 -u disk.py > "$RUNNER_TEMP/disk.out" 2>&1; rc=$?
            cat "$RUNNER_TEMP/disk.out"
            ../ci/alert.sh "$RUNNER_TEMP/disk.out" $rc "Soak host low on disk" "disk OK again"
            # once a day: quarantined apps and leftovers nobody has looked at for 3+ days
            python3 -u held.py > "$RUNNER_TEMP/held.out" 2>&1; rc=$?
            cat "$RUNNER_TEMP/held.out"
            ../ci/alert.sh "$RUNNER_TEMP/held.out" $rc "Soak items held over 3 days"
            if (( tick % 4 == 0 )); then
              for p in darwin windows; do python3 -u watcher.py check --platform $p || true; done
            fi
            if (( $(date +%H) >= 7 )) && [[ ! -f ../results/audit-$(date +%F).json ]]; then
              (cd ../audit && zsh run-daily.sh); tail -5 ../logs/daily-$(date +%F).log || true
            fi
            ../ci/results.sh save "watch ${{ github.run_id }} $tick" || true
            echo "::endgroup::"
            (( $(date +%s) + 1800 > end )) && break
            soak_done && { echo "both passes finished: stopping"; break; }
            for i in $(seq 30); do sleep 60; soak_done && break; done
            soak_done && { echo "both passes finished: stopping"; break; }
            tick=$((tick + 1))
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-${{ github.run_id }}
          path: harness/logs/
          if-no-files-found: ignore
          retention-days: 30

  report:
    # one digest from both platforms' records, after both have saved
    needs: [soak, pool]
    if: always() && needs.soak.result != 'skipped'
    runs-on: ubuntu-latest
    environment: fma-soak   # the ledger reads the instance's FMA catalog for coverage totals
    env:
      FMA_SOAK_TOKEN: ${{ secrets.FMA_SOAK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { path: harness }
      - uses: ./harness/.github/actions/setup
        with: { browser: "false" }
      - run: ./harness/ci/results.sh restore
      - name: Ledger, digest, monthly draft
        working-directory: harness/soak
        env:
          GH_TOKEN: ${{ github.token }}   # context lookups (commits, issues) for new findings
          # recheck reads fleetdm/fleet's project boards (Awaiting QA), which Actions' own token can't
          RECHECK_TOKEN: ${{ secrets.FMA_SOAK_GH_PROJECTS_TOKEN || github.token }}
        run: python3 sample.py --ledger && GH_TOKEN="$RECHECK_TOKEN" python3 recheck.py refresh && python3 digest.py && python3 monthly.py
      - name: Announce new findings (an issue here, so it emails the owner)
        working-directory: harness/soak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in $(date -d yesterday +%F) $(date +%F); do python3 notify.py --date $d; done
          python3 rc_report.py --alert   # RC gate: apps that regressed on the instance's current build
      - run: ./harness/ci/results.sh save "report ${{ github.run_id }}"

  next:
    # Start the next soak run. Not after a cancel (that's a person stopping it). A run that ended early (instance down,
    # hosts offline) waits until 30 min after it started, so an outage retries every 30 min instead of spinning.
    needs: [soak, watch, report]
    if: >-
      always() && vars.FMA_SOAK_CHAIN != 'off' &&
      (needs.soak.result == 'success' || needs.soak.result == 'failure') && needs.watch.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the next soak run
        run: |
          started=$(gh run view ${{ github.run_id }} -R ${{ github.repository }} --json createdAt --jq .createdAt)
          wait=$(( $(date -d "$started" +%s) + 1800 - $(date +%s) ))
          (( wait > 0 )) && { echo "run was short: waiting $wait s"; sleep $wait; }
          gh workflow run fma-soak.yml -R ${{ github.repository }} --ref main -f job=soak
          echo "next soak run requested"

  watcher:
    # by hand only, for a one-off resident check; the watch job does this inside every soak run
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'watcher'
    runs-on: ubuntu-latest
    environment: fma-soak
    timeout-minutes: 30
    env:
      FMA_SOAK_TOKEN: ${{ secrets.FMA_SOAK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { path: harness }
      - uses: ./harness/.github/actions/setup
        with: { browser: "false" }
      - run: ./harness/ci/results.sh restore
      - name: Check residents and hosts
        working-directory: harness/soak
        run: |
          for p in darwin windows; do python3 -u watcher.py check --platform $p; done
          python3 -u hosts.py
          python3 -u stuck.py
      - if: always()
        run: ./harness/ci/results.sh save "watcher ${{ github.run_id }}"

  audit:
    # backup for the watch job's daily audit; skips itself when today's already ran
    if: github.event.schedule == '0 11 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'audit')
    runs-on: ubuntu-latest
    environment: fma-soak
    timeout-minutes: 120
    env:
      FMA_SOAK_TOKEN: ${{ secrets.FMA_SOAK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { path: harness }
      - uses: ./harness/.github/actions/setup
        with: { browser: "false" }
      - run: ./harness/ci/results.sh restore
      - name: Audit, confirm, names
        working-directory: harness/audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: zsh run-daily.sh
      - if: always()
        run: ./harness/ci/results.sh save "audit ${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ github.run_id }}
          path: harness/logs/
          if-no-files-found: ignore
          retention-days: 30
